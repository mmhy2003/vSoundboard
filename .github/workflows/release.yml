# Pushing a vX.Y.Z tag (on main, see CLAUDE.md) publishes a GitHub Release with the installer.
# The release is created as a draft and only made public once the installer is attached.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; only the publish job (which runs no third-party build code) can write.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml version
        run: bash scripts/check-tag-version.sh "$GITHUB_REF_NAME"

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "vSoundboard ${TAG#v}" --generate-notes dist/*.exe
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
