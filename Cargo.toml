[package]
name = "vsoundboard"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "system_fonts"] }
global-hotkey = "0.9.0"
png = "0.18.1"
rfd = "0.17.2"
ringbuf = "0.5.3"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3"] }
tray-icon = "0.26.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"

# The drift tests simulate an hour of audio; unoptimized they take a minute.
[profile.test]
opt-level = 2

[build-dependencies]
winresource = "0.1.34"
