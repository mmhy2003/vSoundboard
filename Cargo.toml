[package]
name = "vsoundboard"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
global-hotkey = "0.9.0"
ringbuf = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

# The drift tests simulate an hour of audio; unoptimized they take a minute.
[profile.test]
opt-level = 2
